header{position:fixed;top:0;left:0;right:0;z-index:45;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;padding-top:max(14px,env(safe-area-inset-top))}

.tb{background:rgba(214,197,155,.92);border:1px solid #7a6540;color:var(--iv);padding:6px 14px;font:13px var(--sa);cursor:pointer;border-radius:99px}.tb:hover{border-color:var(--gd)}

#idx a{display:block;color:var(--mu);text-decoration:none;padding:6px 0;font-size:15px}#idx a:hover,#idx a[aria-current]{color:var(--gd)}
#dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:44;display:flex;flex-direction:column;gap:14px}
#dots a{width:8px;height:8px;border-radius:50%;border:1px solid var(--mu);transition:.4s}#dots a[aria-current]{background:var(--gd);border-color:var(--gd);transform:scale(1.4)}
main{position:relative;z-index:1}
.ch{background:radial-gradient(130% 100% at 50% 35%,rgba(255,246,218,.6),rgba(112,78,36,.38)),radial-gradient(40% 30% at 12% 20%,rgba(120,80,30,.22),transparent),radial-gradient(35% 28% at 88% 78%,rgba(120,80,30,.2),transparent),#d6c59b;min-height:100vh;display:grid;place-items:center;padding:15vh 7vw;position:relative;overflow:hidden}
.in{max-width:760px;position:relative;z-index:2}.in.sp{max-width:1080px;display:grid;gap:48px;align-items:center}
@media(min-width:900px){.in.sp{grid-template-columns:1.2fr .8fr}}@media(max-width:700px){#dots{display:none}}
.in p.no{color:var(--gd);letter-spacing:.25em;text-transform:uppercase;font-size:12px;display:flex;align-items:center;gap:14px;margin-bottom:26px}.in p.no:after{content:"";height:1px;width:64px;background:var(--gd);opacity:.6}
h2{font:500 clamp(30px,5vw,54px)/1.18 var(--se)}body[data-l=hi] h2{font-weight:400;line-height:1.4}
.in p{color:#2d2316;margin-top:1.3em;font-size:18px}.in p.sub{color:var(--mu);font-style:italic;font-family:var(--se);font-size:22px;margin:10px 0 40px}
.big{font:500 clamp(54px,15vw,150px)/1 var(--se);letter-spacing:.06em}

.ph{width:min(330px,72vw);justify-self:center;border:1px solid var(--gd);padding:8px;background:#15130e;box-shadow:0 30px 80px rgba(0,0,0,.7)}.ph img{display:block;width:100%;filter:sepia(.12) brightness(.92)}
figcaption{font-size:12px;color:var(--mu);letter-spacing:.14em;text-transform:uppercase;padding:10px 4px 2px;text-align:center}
.fl{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.fl span{border:1px solid #4a4128;color:var(--gd);padding:5px 14px;border-radius:99px;font-size:14px}
.in p.lb{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gd);margin-top:32px}
.fg{display:grid;gap:14px;margin-top:26px}@media(min-width:700px){.fg{grid-template-columns:1fr 1fr}}
.fg figure{border:1px solid #2c2a22;background:#101012;min-height:120px}.fg img{width:100%;display:block}
.fg .miss{display:grid;place-items:center;border-style:dashed;padding:20px}.fg figure:not(.miss) span{display:none}.fg .miss img{display:none}
.art{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}.art svg{width:100%;height:100%}
.ch:before{content:attr(data-n);position:absolute;left:4vw;top:5vh;font:500 clamp(90px,18vw,240px)/1 var(--se);color:transparent;-webkit-text-stroke:1px rgba(60,40,15,.2);z-index:1}
.in:before{display:none}.ch+.ch{border-top:1px solid rgba(90,67,37,.4)}header{background:linear-gradient(#d6c59b,rgba(214,197,155,0))}
.in p.hl{font:italic 500 clamp(24px,3.4vw,34px)/1.4 var(--se);color:var(--iv)}
.art .dim{fill:#3a3022;opacity:.24}.art .g{fill:var(--gd)}.art .ln{stroke:var(--gd);fill:none;stroke-width:1.3;opacity:.6}.art .ws{stroke:#5a4325;fill:none;stroke-width:.9;opacity:.5}.art text{font:30px 'Caveat',cursive;fill:var(--gd);opacity:.85}
.art .mt{display:none}

@keyframes pl{50%{opacity:.35}}

.lgf{justify-self:center;width:min(280px,58vw);aspect-ratio:206/220;background:var(--lg) center/contain no-repeat;filter:sepia(1) saturate(1.7) hue-rotate(-10deg) brightness(.8) drop-shadow(0 0 38px rgba(122,85,24,.25))}
.gx{grid-column:1/-1;display:grid;gap:18px;margin-top:20px}@media(min-width:760px){.gx{grid-template-columns:1fr 1fr}}

{t:['The Question','वह सवाल'],h:['What if technology could help us look beyond a score?','क्या हो अगर तकनीक हमें एक अंक से आगे देखने में मदद करे?'],p:[['A question came to me: what if AI were used not only to give answers, but to help students understand their situation and explore relevant opportunities?','I may not have the solution to every problem. But I could try.','From that thought, the vision of Arpik.ai began to take shape.'],['मेरे मन में एक सवाल आया: अगर AI का उपयोग सिर्फ़ जवाब देने के लिए नहीं, बल्कि विद्यार्थियों को अपनी स्थिति समझने और सही अवसर खोजने में मदद के लिए हो, तो?','शायद हर समस्या का समाधान मेरे पास न हो। पर कोशिश तो मैं कर सकता था।','इसी सोच से Arpik.ai का विज़न सामने आने लगा।']]},
{t:['Building with Purpose','उद्देश्य के साथ निर्माण'],h:['Not just another tool. A different way to think about guidance.','सिर्फ़ एक और टूल नहीं। मार्गदर्शन को देखने का एक अलग नज़रिया।'],x:4,lg:1,p:[['Arpik.ai does not aim to send every student down one road.','The vision is to keep a student\'s situation, interests and needs in mind, and help them explore directions that are relevant to them.','Because every journey is different, and no single formula fits them all.'],['Arpik.ai का मक़सद हर विद्यार्थी को एक ही रास्ते पर भेजना नहीं है।','विज़न यह है कि विद्यार्थी की स्थिति, रुचियों और ज़रूरतों को ध्यान में रखकर उसे अपने लिए सही दिशाएँ खोजने में मदद मिले।','क्योंकि हर इंसान की यात्रा अलग होती है, और हर यात्रा को एक ही फ़ॉर्मूले में फ़िट नहीं किया जा सकता।']]},
{t:['Beyond Examinations','परीक्षा से आगे'],h:['Your potential is bigger than one examination.','आपकी क्षमता किसी एक परीक्षा से कहीं बड़ी है।'],p:[['Exams like IIT-JEE and NEET are important goals for many students. But a person\'s whole ability cannot be defined by one exam or one result.','Some are drawn to technology, some to research, some to design or creativity.','Students should get the chance to understand their options and make informed decisions.','An exam can be part of your journey. Not your whole identity.'],['IIT-JEE और NEET जैसी परीक्षाएँ बहुत से विद्यार्थियों के लिए अहम लक्ष्य हैं। पर किसी इंसान की पूरी क़ाबिलियत एक परीक्षा या एक नतीजे से तय नहीं होती।','किसी की रुचि तकनीक में है, किसी की शोध में, किसी की डिज़ाइन या रचनात्मकता में।','विद्यार्थियों को अपने विकल्प समझने और सोच-समझकर फ़ैसले लेने के मौक़े मिलने चाहिए।','एक परीक्षा आपकी यात्रा का हिस्सा हो सकती है। आपकी पूरी पहचान नहीं।']]},
{t:['The Human Reason','इंसानी वजह'],h:['No student should feel they have to face everything alone.','किसी भी विद्यार्थी को यह नहीं लगना चाहिए कि उसे सब कुछ अकेले झेलना है।'],p:[['Behind this idea was a personal feeling: when everything feels overwhelming, someone should be there to listen, to help you see your options, and to remind you that life is far bigger than one result.','Arpik.ai is an attempt born from that thought. It is not a replacement for a professional counsellor, a trusted adult or real human support.','If you are struggling, please talk to someone you trust. In India, Tele-MANAS (14416) is free and open 24x7.'],['इस विचार के पीछे एक निजी एहसास था: जब सब कुछ बहुत भारी लगे, तब कोई सुनने वाला हो, जो विकल्प समझने में मदद करे और याद दिलाए कि ज़िंदगी किसी एक नतीजे से कहीं बड़ी है।','Arpik.ai उसी सोच से निकली एक कोशिश है। यह किसी पेशेवर काउंसलर, भरोसेमंद बड़े या असली इंसानी सहारे का विकल्प नहीं है।','अगर आप मुश्किल में हैं, तो किसी भरोसेमंद इंसान से बात करें। भारत में टेली-मानस (14416) मुफ़्त और 24x7 उपलब्ध है।']]},
{t:['What This Dream Stands For','यह सपना किसलिए है'],h:['The goal is not to promise every answer. It is to help people discover better questions.','लक्ष्य हर जवाब का वादा करना नहीं है। लक्ष्य है बेहतर सवाल खोजने में मदद करना।'],p:[['Arpik.ai is still a journey of learning, building, testing and improving.','I do not claim that one platform can solve every problem. But if technology helps even one student understand new options, reach the right support, or decide with more clarity, then this work is meaningful.'],['Arpik.ai अभी सीखने, बनाने, परखने और सुधारने की यात्रा है।','मैं यह दावा नहीं करता कि एक प्लेटफ़ॉर्म हर समस्या सुलझा सकता है। पर अगर तकनीक किसी एक विद्यार्थी को भी नए विकल्प समझने, सही सहारे तक पहुँचने या ज़्यादा स्पष्टता से फ़ैसला लेने में मदद करे, तो यह काम सार्थक है।']]},
{t:['The Opening, Not the Ending','शुरुआत, अंत नहीं'],h:['Your marks tell a part of your story. They do not tell the whole story.','आपके अंक आपकी कहानी का एक हिस्सा बताते हैं, पूरी कहानी नहीं।'],x:8,p:[['I am Arpit Pareek. Arpik.ai is my attempt: an idea I understood from my own experience, and chose to carry forward with technology.','I do not know how far this journey will go. But I want its direction to remember one thing:','Every student deserves to be understood. Every student has the right to explore their possibilities. And no one should decide their whole worth from one exam, one rejection or one difficult phase.','This is not only the story of Arpik.ai. It is the story of a possibility: that technology, built with people at the centre, can do something meaningful.'],['मैं अर्पित पारीक हूँ। Arpik.ai मेरी एक कोशिश है: एक ऐसा विचार जिसे मैंने अपने अनुभव से समझा और तकनीक की मदद से आगे बढ़ाने का फ़ैसला किया।','मुझे नहीं पता यह यात्रा कितनी दूर जाएगी। पर मैं चाहता हूँ कि इसकी दिशा एक बात याद रखे:','हर विद्यार्थी को समझे जाने का मौक़ा मिलना चाहिए। हर विद्यार्थी को अपनी संभावनाएँ खोजने का हक़ है। और किसी को भी अपनी पूरी क़ीमत एक परीक्षा, एक अस्वीकृति या एक कठिन दौर से तय नहीं करनी चाहिए।','यह सिर्फ़ Arpik.ai की कहानी नहीं है। यह उस संभावना की कहानी है कि तकनीक, जब इंसान को केंद्र में रखकर बनाई जाए, तो कुछ सार्थक कर सकती है।']]}

const F=[['Reflect',['In coaching, regret and worry stayed unspoken. Reflect gives them a shape.','कोचिंग में पछतावा और चिंता अनकही रह जाती थी। Reflect उन्हें एक आकार देता है।'],['Four guided questions end in a card: Regret, Reason, Pattern, Lesson and Next step.','चार सवालों के बाद एक कार्ड मिलता है: पछतावा, कारण, पैटर्न, सीख और अगला कदम।'],['Pick a mood, write in any language, answer the questions.','मूड चुनें, किसी भी भाषा में लिखें और सवालों के जवाब दें।']],
