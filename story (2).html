f:'Reflect पछतावे को सीख और अगले कदम में बदलता है। Radar आधिकारिक अवसरों तक पहुँचाता है। Decide दो विकल्पों को तौलता है, आपके लिए चुनता नहीं। Growth आपकी streak और mood graph दिखाता है।',v:'आगे: हर विद्यार्थी को उसकी अपनी स्थिति के अनुरूप दिशा खोजने में मदद करने का बढ़ता विज़न। यह एक यात्रा है, पूरा हो चुका वादा नहीं।'}};
const C=[
{t:['Before the Idea','विचार से पहले'],h:['Some ideas begin with ambition. Others begin with a question that refuses to leave you.','कुछ विचार महत्वाकांक्षा से शुरू होते हैं। और कुछ एक ऐसे सवाल से, जो पीछा नहीं छोड़ता।'],p:[['This is not only the story of building an AI.','It is the story of one question: is every student truly understood?'],['यह सिर्फ़ AI बनाने की कहानी नहीं है।','यह उस सवाल की कहानी है: क्या हर विद्यार्थी को सच में समझा जाता है?']]},
{t:['Lost in the Crowd','भीड़ में खोए'],h:['Being in a crowd and being understood are two different things.','भीड़ में होना और समझा जाना, दो अलग बातें हैं।'],p:[['During coaching, I noticed something. There were so many students around us, each with their own pressure, expectations and story.','But in a crowd, one student\'s own situation can go unseen.','Seeing marks is not enough. We also need to understand where a student stands, what their strengths are, and which paths could open for them.'],['कोचिंग के दौरान मैंने एक बात महसूस की। हमारे आसपास बहुत सारे विद्यार्थी थे, हर किसी का अपना दबाव, अपनी उम्मीदें और अपनी कहानी।','पर भीड़ के बीच कभी-कभी एक विद्यार्थी की अपनी स्थिति नज़र ही नहीं आती।','सिर्फ़ यह देखना काफ़ी नहीं कि कोई कितने अंक ला रहा है। यह समझना भी ज़रूरी है कि वह किस स्थिति में है, उसकी ताक़तें क्या हैं और उसके लिए कौन-से रास्ते खुल सकते हैं।']]},
{t:['The Question','वह सवाल'],h:['What if technology could help us look beyond a score?','क्या हो अगर तकनीक हमें एक अंक से आगे देखने में मदद करे?'],p:[['A question came to me: what if AI were used not only to give answers, but to help students understand their situation and explore relevant opportunities?','I may not have the solution to every problem. But I could try.','From that thought, the vision of Arpik.ai began to take shape.'],['मेरे मन में एक सवाल आया: अगर AI का उपयोग सिर्फ़ जवाब देने के लिए नहीं, बल्कि विद्यार्थियों को अपनी स्थिति समझने और सही अवसर खोजने में मदद के लिए हो, तो?','शायद हर समस्या का समाधान मेरे पास न हो। पर कोशिश तो मैं कर सकता था।','इसी सोच से Arpik.ai का विज़न सामने आने लगा।']]},
{t:['Building with Purpose','उद्देश्य के साथ निर्माण'],h:['Not just another tool. A different way to think about guidance.','सिर्फ़ एक और टूल नहीं। मार्गदर्शन को देखने का एक अलग नज़रिया।'],x:4,lg:1,p:[['Arpik.ai does not aim to send every student down one road.','The vision is to keep a student\'s situation, interests and needs in mind, and help them explore directions that are relevant to them.','Because every journey is different, and no single formula fits them all.'],['Arpik.ai का मक़सद हर विद्यार्थी को एक ही रास्ते पर भेजना नहीं है।','विज़न यह है कि विद्यार्थी की स्थिति, रुचियों और ज़रूरतों को ध्यान में रखकर उसे अपने लिए सही दिशाएँ खोजने में मदद मिले।','क्योंकि हर इंसान की यात्रा अलग होती है, और हर यात्रा को एक ही फ़ॉर्मूले में फ़िट नहीं किया जा सकता।']]},
{t:['Beyond Examinations','परीक्षा से आगे'],h:['Your potential is bigger than one examination.','आपकी क्षमता किसी एक परीक्षा से कहीं बड़ी है।'],p:[['Exams like IIT-JEE and NEET are important goals for many students. But a person\'s whole ability cannot be defined by one exam or one result.','Some are drawn to technology, some to research, some to design or creativity.','Students should get the chance to understand their options and make informed decisions.','An exam can be part of your journey. Not your whole identity.'],['IIT-JEE और NEET जैसी परीक्षाएँ बहुत से विद्यार्थियों के लिए अहम लक्ष्य हैं। पर किसी इंसान की पूरी क़ाबिलियत एक परीक्षा या एक नतीजे से तय नहीं होती।','किसी की रुचि तकनीक में है, किसी की शोध में, किसी की डिज़ाइन या रचनात्मकता में।','विद्यार्थियों को अपने विकल्प समझने और सोच-समझकर फ़ैसले लेने के मौक़े मिलने चाहिए।','एक परीक्षा आपकी यात्रा का हिस्सा हो सकती है। आपकी पूरी पहचान नहीं।']]},
{t:['The Human Reason','इंसानी वजह'],h:['No student should feel they have to face everything alone.','किसी भी विद्यार्थी को यह नहीं लगना चाहिए कि उसे सब कुछ अकेले झेलना है।'],p:[['Behind this idea was a personal feeling: when everything feels overwhelming, someone should be there to listen, to help you see your options, and to remind you that life is far bigger than one result.','Arpik.ai is an attempt born from that thought. It is not a replacement for a professional counsellor, a trusted adult or real human support.','If you are struggling, please talk to someone you trust. In India, Tele-MANAS (14416) is free and open 24x7.'],['इस विचार के पीछे एक निजी एहसास था: जब सब कुछ बहुत भारी लगे, तब कोई सुनने वाला हो, जो विकल्प समझने में मदद करे और याद दिलाए कि ज़िंदगी किसी एक नतीजे से कहीं बड़ी है।','Arpik.ai उसी सोच से निकली एक कोशिश है। यह किसी पेशेवर काउंसलर, भरोसेमंद बड़े या असली इंसानी सहारे का विकल्प नहीं है।','अगर आप मुश्किल में हैं, तो किसी भरोसेमंद इंसान से बात करें। भारत में टेली-मानस (14416) मुफ़्त और 24x7 उपलब्ध है।']]},
{t:['What This Dream Stands For','यह सपना किसलिए है'],h:['The goal is not to promise every answer. It is to help people discover better questions.','लक्ष्य हर जवाब का वादा करना नहीं है। लक्ष्य है बेहतर सवाल खोजने में मदद करना।'],p:[['Arpik.ai is still a journey of learning, building, testing and improving.','I do not claim that one platform can solve every problem. But if technology helps even one student understand new options, reach the right support, or decide with more clarity, then this work is meaningful.'],['Arpik.ai अभी सीखने, बनाने, परखने और सुधारने की यात्रा है।','मैं यह दावा नहीं करता कि एक प्लेटफ़ॉर्म हर समस्या सुलझा सकता है। पर अगर तकनीक किसी एक विद्यार्थी को भी नए विकल्प समझने, सही सहारे तक पहुँचने या ज़्यादा स्पष्टता से फ़ैसला लेने में मदद करे, तो यह काम सार्थक है।']]},
{t:['The Opening, Not the Ending','शुरुआत, अंत नहीं'],h:['Your marks tell a part of your story. They do not tell the whole story.','आपके अंक आपकी कहानी का एक हिस्सा बताते हैं, पूरी कहानी नहीं।'],x:8,p:[['I am Arpit Pareek. Arpik.ai is my attempt: an idea I understood from my own experience, and chose to carry forward with technology.','I do not know how far this journey will go. But I want its direction to remember one thing:','Every student deserves to be understood. Every student has the right to explore their possibilities. And no one should decide their whole worth from one exam, one rejection or one difficult phase.','This is not only the story of Arpik.ai. It is the story of a possibility: that technology, built with people at the centre, can do something meaningful.'],['मैं अर्पित पारीक हूँ। Arpik.ai मेरी एक कोशिश है: एक ऐसा विचार जिसे मैंने अपने अनुभव से समझा और तकनीक की मदद से आगे बढ़ाने का फ़ैसला किया।','मुझे नहीं पता यह यात्रा कितनी दूर जाएगी। पर मैं चाहता हूँ कि इसकी दिशा एक बात याद रखे:','हर विद्यार्थी को समझे जाने का मौक़ा मिलना चाहिए। हर विद्यार्थी को अपनी संभावनाएँ खोजने का हक़ है। और किसी को भी अपनी पूरी क़ीमत एक परीक्षा, एक अस्वीकृति या एक कठिन दौर से तय नहीं करनी चाहिए।','यह सिर्फ़ Arpik.ai की कहानी नहीं है। यह उस संभावना की कहानी है कि तकनीक, जब इंसान को केंद्र में रखकर बनाई जाए, तो कुछ सार्थक कर सकती है।']]},{t:['Every Function','हर फ़ंक्शन'],h:['Every function, and why it exists.','हर फ़ंक्शन, और वह क्यों है।'],ph:1,g:1,p:[['Every part of Arpik.ai answers something I felt in coaching. Here is what each function does, how to use it, and the reason I built it.'],['Arpik.ai का हर हिस्सा कोचिंग में महसूस की गई किसी बात का जवाब है। यहाँ देखिए हर फ़ंक्शन क्या करता है, कैसे इस्तेमाल करें, और मैंने उसे क्यों बनाया।']]}];
const F=[['Reflect',['In coaching, regret and worry stayed unspoken. Reflect gives them a shape.','कोचिंग में पछतावा और चिंता अनकही रह जाती थी। Reflect उन्हें एक आकार देता है।'],['Four guided questions end in a card: Regret, Reason, Pattern, Lesson and Next step.','चार सवालों के बाद एक कार्ड मिलता है: पछतावा, कारण, पैटर्न, सीख और अगला कदम।'],['Pick a mood, write in any language, answer the questions.','मूड चुनें, किसी भी भाषा में लिखें और सवालों के जवाब दें।']],
['Talk',['Sometimes a student only needs someone to listen at the right moment.','कभी-कभी विद्यार्थी को बस सही समय पर कोई सुनने वाला चाहिए होता है।'],['A free AI chats in any language. Speak with the mic and hear replies aloud.','एक मुफ़्त AI किसी भी भाषा में बात करता है। माइक से बोलें और जवाब सुनें भी।'],['Type or tap the mic and share what is on your mind. It is a thinking aid, not a counsellor.','लिखें या माइक दबाकर अपनी बात कहें। यह सोचने में मदद करता है, काउंसलर का विकल्प नहीं।']],
['Radar',['Many students never hear about the scholarships and courses meant for them.','बहुत से विद्यार्थियों को अपने लिए बनी छात्रवृत्तियों और कोर्स का पता ही नहीं चलता।'],['17 official platforms for scholarships, internships, free courses and exams, with a day counter for your own deadline.','छात्रवृत्ति, इंटर्नशिप, फ़्री कोर्स और परीक्षाओं के 17 आधिकारिक प्लेटफ़ॉर्म, और आपकी अपनी आख़िरी तारीख़ की गिनती।'],['Pick what you want, open the official site, save it and add the deadline you found there.','जो चाहिए चुनें, आधिकारिक साइट खोलें, सेव करें और वहाँ मिली आख़िरी तारीख़ जोड़ें।']],
['Decide',['A score should not choose a life for you. You should.','आपकी ज़िंदगी का फ़ैसला अंक नहीं, आप करें।'],['Enter two options with pros and cons. You get uncertainties, consequences and questions to ask yourself. It never picks for you.','दो विकल्प और उनके फ़ायदे-नुक़सान लिखें। आपको अनिश्चितताएँ, नतीजे और ख़ुद से पूछने लायक़ सवाल मिलते हैं। यह कभी चुनाव नहीं करता।'],['Write the decision, fill both sides, read the questions, then choose.','फ़ैसला लिखें, दोनों तरफ़ भरें, सवाल पढ़ें, फिर ख़ुद चुनें।']],
['Growth',['Progress stays invisible when only marks are counted. Growth shows the rest.','सिर्फ़ अंक गिनने पर प्रगति दिखती नहीं। Growth बाक़ी सब दिखाता है।'],['Your streak, mood graph, common reasons, lessons and a next-step checklist.','आपकी streak, mood graph, आम कारण, सीखें और अगले कदमों की सूची।'],['Open Growth, review your trend, and tick each next step when you finish it.','Growth खोलें, अपना रुझान देखें और कदम पूरा होने पर टिक करें।']],
['Lesson card',['A lesson becomes real when you can hold it.','सीख तब असली लगती है जब आप उसे थाम सकें।'],['Turns a lesson into an image you can share.','एक सीख को साझा करने लायक़ तस्वीर बना देता है।'],['After Reflect, tap Save lesson card. Leave out private details if you share it.','Reflect के बाद Save lesson card दबाएँ। साझा करते समय निजी बातें न लिखें।']],
['Feedback',['This is a young project, and students should shape what comes next.','यह एक नया प्रोजेक्ट है, और आगे क्या बने, यह विद्यार्थियों को तय करना चाहिए।'],['Your message reaches me by email.','आपका संदेश ईमेल से सीधे मुझ तक पहुँचता है।'],['Tell me what worked and what did not. Please keep private reflections out of it.','बताइए क्या काम आया और क्या नहीं। अपनी निजी बातें इसमें न लिखें।']],
['Privacy and Install',['Honest reflection needs a safe place.','ईमानदार सोच के लिए एक सुरक्षित जगह चाहिए।'],['Your reflections stay on your device. Text sent for AI replies goes to a free AI service. There is an optional PIN, you can download or delete your data any time, and it installs like an app with basics working offline.','आपकी लिखी बातें आपके फ़ोन में रहती हैं। AI के जवाब के लिए भेजा गया टेक्स्ट एक मुफ़्त AI सेवा तक जाता है। चाहें तो PIN लगाएँ, डेटा कभी भी डाउनलोड या डिलीट करें। यह ऐप की तरह इंस्टॉल होता है और बुनियादी हिस्से ऑफ़लाइन चलते हैं।'],['Turn on the optional PIN, and use Install or Add to Home Screen.','वैकल्पिक PIN चालू करें, और Install या Add to Home Screen चुनें।']]];
